<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@300&display=swap"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@500&display=swap"
      rel="stylesheet"
    />
  </head>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Oswald", sans-serif;
      user-select: none;
    }
    ::-webkit-scrollbar {
      width: 3px;
    }
    input::-webkit-outer-spin-button,
    input::-webkit-inner-spin-button {
      appearance: none;
      margin: 0;
    }
    ::-webkit-scrollbar-thumb {
      background-color: rgba(82, 45, 45, 0.63);
      border-radius: 12px;
      width: 0px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0);
    }
    .StatsUIMain {
      width: 100%;
      height: 100%;
      position: absolute;
      overflow: hidden;

    }
    
  </style>
  <body>
    <div class="StatsUIMain">
       <div style="position: absolute; top: 25%; right: 1%; display: flex; justify-content: right; align-items: center; " v-if="JailTime > 0" >
        <p style="position: relative; color: rgb(255, 80, 80); margin: 1%; font-size: 1.2vw; text-shadow: 1px 1px 2px black;">{{setTimes(JailTime)}}</p>
        <div style="position: relative; width: 5vw; height: 5vw; margin: 1%; display: flex; justify-content: center; align-items: center; border-left: 4px solid rgb(255, 80, 80);;border-right: 4px solid rgb(255, 80, 80);;">
            <img src="./jail.png" style="width: 2vw; filter: drop-shadow(0px 0px 2px black);" alt="">
        </div>
      
        <div style="position: relative; width: 16vw; margin: 1%;text-shadow: 1px 1px 2px black;">
            <p style="color: rgb(255, 80, 80); font-size: 1vw; position: relative;">YOU ARE IN JAIL</p>
            <p style="color: rgb(255, 255, 255);; font-size: 1.2vw; position: relative;">{{Reason}}</p>
            <p style="color: rgb(255, 255, 255); text-transform: uppercase; font-size: 0.8vw; position: relative;">PLAYER {{JailedBy}}</p>
        </div>
       </div>
    </div>
  </body>
  <script src="package://vue.min.js"></script>
  <script src="./Stats.js"></script>
</html>
